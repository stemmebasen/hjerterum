name: Bootstrap Lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.3.4 --activate
      - name: Resolve dependency graph without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit generated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock pnpm dependency graph"
          gh auth setup-git
          git push origin HEAD:main
