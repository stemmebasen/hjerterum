name: Cirkler-viden

# Requested: "hun skal vide alt om cirkler fra cirklers hjemmeside". Every night cirkler.net's public pages are read in a real
# browser and put in the staging database's table cirkler_site, which Saga answers about CIRKLER from.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cirkler-site
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@12.3.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install a browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Read cirkler.net
        run: NODE_PATH=/tmp/pw/node_modules node .github/scripts/read-cirkler-site.cjs /tmp/cirkler-site.sql
      - name: Put it in the database
        shell: bash
        run: |
          set -euo pipefail
          D1_ID="$(pnpm --dir apps/web exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs hjerterum-staging)"
          test -n "$D1_ID"
          node .github/scripts/configure-staging-d1.mjs "$D1_ID"
          pnpm --dir apps/web exec wrangler d1 execute DB --remote --env staging --file /tmp/cirkler-site.sql
