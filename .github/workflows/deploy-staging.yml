name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.3.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Deploy staging Worker and assets
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/web deploy:staging 2>&1 | node .github/scripts/capture-workers-url.mjs
      - name: Smoke test deployed staging API and frontend
        env:
          STAGING_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          test -n "$STAGING_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"environment":"staging"' /tmp/health.json
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/" >/tmp/index.html
          grep -q '<div id="root"></div>' /tmp/index.html
