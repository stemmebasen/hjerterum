name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hjerterum-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_MEMBER_WEBHOOK_SECRET: ${{ secrets.STRIPE_MEMBER_WEBHOOK_SECRET }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      STATS_API_SECRET: ${{ secrets.STATS_API_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - name: Check whether Cloudflare staging is configured
        id: credentials
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare staging credentials are configured."
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare staging credentials are not configured yet; deploy is skipped safely."
          fi

      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.cloudflare == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
        if: steps.credentials.outputs.cloudflare == 'true'
      - run: corepack prepare pnpm@12.3.4 --activate
        if: steps.credentials.outputs.cloudflare == 'true'
      - run: pnpm install --frozen-lockfile
        if: steps.credentials.outputs.cloudflare == 'true'
      - run: pnpm typecheck
        if: steps.credentials.outputs.cloudflare == 'true'
      - run: pnpm test
        if: steps.credentials.outputs.cloudflare == 'true'

      - name: Resolve or create staging D1 database
        if: steps.credentials.outputs.cloudflare == 'true'
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_NAME="hjerterum-staging"
          D1_ID="$(pnpm --dir apps/web exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs "$DATABASE_NAME")"
          if [ -z "$D1_ID" ]; then
            pnpm --dir apps/web exec wrangler d1 create "$DATABASE_NAME" --location weur >/tmp/d1-create.log
            D1_ID="$(pnpm --dir apps/web exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs "$DATABASE_NAME")"
          fi
          test -n "$D1_ID"
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"
          node .github/scripts/configure-staging-d1.mjs "$D1_ID"

      - name: Apply staging D1 migrations
        if: steps.credentials.outputs.cloudflare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec wrangler d1 migrations apply DB --remote --env staging

      - run: pnpm build
        if: steps.credentials.outputs.cloudflare == 'true'

      - name: Deploy staging Worker and assets
        if: steps.credentials.outputs.cloudflare == 'true'
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/web deploy:staging 2>&1 | node .github/scripts/capture-workers-url.mjs

      - name: Sync configured application secrets to staging Worker
        if: steps.credentials.outputs.cloudflare == 'true'
        env:
          STAGING_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          put_if_set() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm --dir apps/web exec wrangler secret put "$name" --env staging >/dev/null
            fi
          }
          put_if_set CLERK_JWT_ISSUER "${CLERK_JWT_ISSUER:-}"
          put_if_set CLERK_PUBLISHABLE_KEY "${CLERK_PUBLISHABLE_KEY:-}"
          put_if_set CLERK_SECRET_KEY "${CLERK_SECRET_KEY:-}"
          put_if_set STRIPE_PUBLISHABLE_KEY "${STRIPE_PUBLISHABLE_KEY:-}"
          put_if_set STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
          put_if_set STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"
          put_if_set STRIPE_MEMBER_WEBHOOK_SECRET "${STRIPE_MEMBER_WEBHOOK_SECRET:-}"
          put_if_set ALLOWED_EMAILS "${ALLOWED_EMAILS:-}"
          put_if_set RESEND_API_KEY "${RESEND_API_KEY:-}"
          put_if_set CLERK_WEBHOOK_SECRET "${CLERK_WEBHOOK_SECRET:-}"
          put_if_set STATS_API_SECRET "${STATS_API_SECRET:-}"
          printf '%s' "$STAGING_URL" | pnpm --dir apps/web exec wrangler secret put APP_BASE_URL --env staging >/dev/null

      - name: Smoke test deployed staging API, D1, MembershipWorks and frontend
        if: steps.credentials.outputs.cloudflare == 'true'
        env:
          STAGING_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"environment":"staging"' /tmp/health.json
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/readiness" | tee /tmp/readiness.json
          grep -q '"status":"ready"' /tmp/readiness.json
          grep -q '"database":"ready"' /tmp/readiness.json
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/events/external" >/tmp/external-events.json
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/external-events.json","utf8"));if(!Array.isArray(data))process.exit(1);console.log(`membershipworks_events=${data.length}`)'
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/client-config" >/tmp/client-config.json
          if [ -n "${CLERK_PUBLISHABLE_KEY:-}" ]; then
            grep -q '"clerkPublishableKey":"pk_' /tmp/client-config.json
          fi
          if [ -n "${STRIPE_PUBLISHABLE_KEY:-}" ]; then
            grep -q '"stripePublishableKey":"pk_' /tmp/client-config.json
          fi
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/" >/tmp/index.html
          grep -q '<div id="root"></div>' /tmp/index.html
