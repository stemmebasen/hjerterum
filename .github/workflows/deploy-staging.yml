name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_MEMBER_WEBHOOK_SECRET: ${{ secrets.STRIPE_MEMBER_WEBHOOK_SECRET }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.3.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Validate required staging credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN \
            CLERK_JWT_ISSUER CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_MEMBER_WEBHOOK_SECRET \
            ALLOWED_EMAILS
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Resolve or create staging D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_NAME="hjerterum-staging"
          D1_ID="$(pnpm --dir apps/web exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs "$DATABASE_NAME")"
          if [ -z "$D1_ID" ]; then
            pnpm --dir apps/web exec wrangler d1 create "$DATABASE_NAME" --location weur >/tmp/d1-create.log
            D1_ID="$(pnpm --dir apps/web exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs "$DATABASE_NAME")"
          fi
          test -n "$D1_ID"
          echo "database_id=$D1_ID" >> "$GITHUB_OUTPUT"
          node .github/scripts/configure-staging-d1.mjs "$D1_ID"

      - name: Apply staging D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec wrangler d1 migrations apply DB --remote --env staging

      - run: pnpm build

      - name: Deploy staging Worker and assets
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/web deploy:staging 2>&1 | node .github/scripts/capture-workers-url.mjs

      - name: Sync application secrets to staging Worker
        env:
          STAGING_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | pnpm --dir apps/web exec wrangler secret put "$name" --env staging >/dev/null
          }
          put_secret CLERK_JWT_ISSUER "$CLERK_JWT_ISSUER"
          put_secret CLERK_PUBLISHABLE_KEY "$CLERK_PUBLISHABLE_KEY"
          put_secret CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          put_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          put_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          put_secret STRIPE_MEMBER_WEBHOOK_SECRET "$STRIPE_MEMBER_WEBHOOK_SECRET"
          put_secret ALLOWED_EMAILS "$ALLOWED_EMAILS"
          put_secret APP_BASE_URL "$STAGING_URL"

      - name: Smoke test deployed staging API, D1, auth config and frontend
        env:
          STAGING_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"environment":"staging"' /tmp/health.json
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/api/readiness" | tee /tmp/readiness.json
          grep -q '"status":"ready"' /tmp/readiness.json
          grep -q '"database":"ready"' /tmp/readiness.json
          curl --fail --silent --show-error "$STAGING_URL/api/client-config" | tee /tmp/client-config.json
          grep -q '"clerkPublishableKey":"pk_' /tmp/client-config.json
          STATUS="$(curl --silent --output /tmp/member-auth.json --write-out '%{http_code}' "$STAGING_URL/api/members/me")"
          test "$STATUS" = "401"
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 45 "$STAGING_URL/" >/tmp/index.html
          grep -q '<div id="root"></div>' /tmp/index.html
