name: Flokken (holistisk portal) – staging

# The event portal (apps/holistisk) deploys on its own: its own Worker (holistisk-portal-staging on workers.dev),
# its own D1 database and its own cron. It never deploys or configures Hjerterum (apps/web), and it sets no routes
# or custom domains. Production is not deployed by any workflow.
on:
  push:
    branches: [main, "claude/holistisk-*"]
    paths:
      - "apps/holistisk/**"
      - ".github/workflows/holistisk-staging.yml"
      - ".github/scripts/configure-holistisk-d1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holistisk-portal-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HOLISTISK_BILLETTO_API_KEYPAIR: ${{ secrets.HOLISTISK_BILLETTO_API_KEYPAIR }}
      HOLISTISK_CONTACT_EMAIL: ${{ vars.HOLISTISK_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.3.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @holistisk/portal typecheck
      - run: pnpm --filter @holistisk/portal test
      - run: pnpm --filter @holistisk/portal build

      - name: Check whether Cloudflare is configured
        id: credentials
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; the staging deploy is skipped."
          fi

      - name: Resolve or create the portal's own staging D1 database
        if: steps.credentials.outputs.cloudflare == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NAME="holistisk-portal-staging"
          D1_ID="$(pnpm --dir apps/holistisk exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs "$NAME")"
          if [ -z "$D1_ID" ]; then
            pnpm --dir apps/holistisk exec wrangler d1 create "$NAME" --location weur >/tmp/d1-create.log
            D1_ID="$(pnpm --dir apps/holistisk exec wrangler d1 list --json | node .github/scripts/find-d1-database-id.mjs "$NAME")"
          fi
          test -n "$D1_ID"
          node .github/scripts/configure-holistisk-d1.mjs "$D1_ID"

      - name: Apply the portal's migrations
        if: steps.credentials.outputs.cloudflare == 'true'
        run: pnpm --dir apps/holistisk exec wrangler d1 migrations apply DB --remote --env staging

      - name: Deploy the portal's staging Worker
        if: steps.credentials.outputs.cloudflare == 'true'
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/holistisk exec wrangler deploy --env staging 2>&1 | node .github/scripts/capture-workers-url.mjs

      - name: Set the portal's secrets
        if: steps.credentials.outputs.cloudflare == 'true'
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | pnpm --dir apps/holistisk exec wrangler secret put "$1" --env staging >/dev/null; }
          # A fresh token for each deploy: used once below to run the collector, known to no one afterwards.
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          put INGEST_TOKEN "$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          put PUBLIC_BASE_URL "${{ steps.deploy.outputs.worker_url }}"
          if [ -n "${HOLISTISK_BILLETTO_API_KEYPAIR:-}" ]; then put BILLETTO_API_KEYPAIR "$HOLISTISK_BILLETTO_API_KEYPAIR"; fi
          if [ -n "${HOLISTISK_CONTACT_EMAIL:-}" ]; then put CONTACT_EMAIL "$HOLISTISK_CONTACT_EMAIL"; fi

      - name: Smoke test – collector, pages, filters and no indexing
        if: steps.credentials.outputs.cloudflare == 'true'
        env:
          URL: ${{ steps.deploy.outputs.worker_url }}
          TOKEN: ${{ steps.secrets.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-all-errors --retry-max-time 60 "$@"; }
          retry "$URL/api/health" | tee /tmp/health.json
          grep -q '"environment": "staging"' /tmp/health.json
          # Run the collector now (the cron runs it hourly). One run stays within the request budget, so the sources
          # take turns: run until none is deferred, then require the core sources to have been collected (the venues are
          # listed; one being down for a day does not stop a deploy).
          for i in 1 2 3 4 5 6 7 8; do
            retry -X POST -H "authorization: Bearer $TOKEN" "$URL/api/ingest/run" > /tmp/run.json
            node -e 'const r=require("/tmp/run.json");console.log(JSON.stringify({status:r.status,reason:r.reason,deferred:r.deferred,sources:r.sources.map(s=>[s.id,s.status,s.error??s.fetched])}))'
            node -e 'process.exit(require("/tmp/run.json").deferred?.length ? 1 : 0)' && break
          done
          retry "$URL/api/status" > /tmp/sources.json
          node -e 'const s=require("/tmp/sources.json");console.log(JSON.stringify(s.sources,null,1));for(const id of ["hjerterum","lysetshus","brahma-kumaris-aarhus","buddhistisk-center-aarhus","dansk-center-for-mindfulness","vaekstcenteret","favn-aarhus"]){const x=s.sources.find(y=>y.id===id);if(!x||x.status!=="ok"){console.error("source not collected: "+id+" "+JSON.stringify(x));process.exit(1)}}if(!(s.sources.find(y=>y.id==="hjerterum").fetched>0))process.exit(1)'
          retry "$URL/api/status" | tee /tmp/status.json
          node -e 'const s=require("/tmp/status.json");if(!s.healthy||s.events.upcoming<1)process.exit(1)'
          # Flokken as an association: the Worker's own address.
          # Each page is saved and then searched: a grep -q that stops early would cut curl off under pipefail.
          G() { retry "$URL$1" > /tmp/page.html; grep -q "$2" /tmp/page.html; }
          retry "$URL/" > /tmp/home.html
          grep -q 'data-edition="forening"' /tmp/home.html
          grep -q 'Kultur i en lille' /tmp/home.html
          retry "$URL/maanedens-events" > /dev/null
          G /skriv-dig-op 'name="samtykke"'
          G /for-foreninger 'Det får I ud af det'
          G /tryghed 'Værten tager imod'
          G /privatliv 'Slet mine oplysninger'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$URL/admin")" = 303
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$URL/kalender")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'origin: https://evil.example' --data 'fornavn=X' "$URL/skriv-dig-op")" = 403
          # The event portal, as shown at www.jacobhauge.com/socialklubben.
          MOUNT='x-flokken-mount: https://www.jacobhauge.com/socialklubben'
          P() { retry -H "$MOUNT" "$URL$1"; }
          PG() { P "$1" > /tmp/page.html; grep -q "$2" /tmp/page.html; }
          P / > /tmp/portal.html
          grep -q 'flok at følges med' /tmp/portal.html
          grep -q 'Sådan virker Socialklubben' /tmp/portal.html
          PG /spar-paa-billetten 'Medlemsfordele'
          P /kalender > /tmp/events.html
          EVENT_PATH="$(grep -o 'href="/socialklubben/events/[a-z0-9-]*"' /tmp/events.html | head -1 | sed 's/href="\/socialklubben//;s/"$//')"
          test -n "$EVENT_PATH"
          P "$EVENT_PATH" > /tmp/event.html
          grep -q 'application/ld+json' /tmp/event.html
          grep -q 'Tilmeld hos arrangøren\|Dette event er afholdt' /tmp/event.html
          grep -q 'id="flokke"' /tmp/event.html
          PG "/kalender?kategori=yoga&periode=maaned&omraade=aarhus" 'class="results-count"'
          PG /aarhus '<h1>Events i Aarhus</h1>'
          PG /kort 'id="kort-data"'
          PG /find-en-flok '<h1>Find en flok</h1>'
          PG /log-ind 'action="/socialklubben/bliv-medlem"'
          PG /samarbejde 'billetfordel'
          PG /tryghed 'offentligt sted'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "$MOUNT" -X POST -H 'origin: https://evil.example' --data 'fornavn=X' "$URL/bliv-medlem")" = 403
          PG /spiritualitet/aarhus '<h1>Spirituelle arrangementer i Aarhus</h1>'
          PG /klarsyn/aarhus '<h1>Klarsynsaftener i Aarhus</h1>'
          PG /arrangoerer/buddhistisk-center-aarhus 'Karmapa'
          PG /sitemap.xml '/meditation/aarhus'
          retry "$URL/robots.txt" | grep -q 'Disallow: /'
          curl --silent --head "$URL/" | grep -qi '^x-robots-tag: noindex'
          echo "Staging verified: $URL"
