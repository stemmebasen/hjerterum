name: Natlig kopi

# Requested (3 November 2026): "kan vi ikke helt erstatte Google-kontoen og så lave 'vores egen Google-konto' med R2 i admin?" - "Ja".
# Every night a full copy of the platform's database (D1, SQL) is packed and laid in the archive's R2 bucket under kopier/. The Worker keeps
# the newest 30 and the first of each month for a year, and admin → Filarkiv → Sikkerhedskopier lets the chair download them (apps/web/worker/archive.ts).

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natlig-kopi
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Its own token ("hjerterum natlig kopi": D1 Edit + Workers R2 Storage Edit), made by the chair, so the deploy token is untouched.
      BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@12.3.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Export the database and lay the copy in the archive
        shell: bash
        run: |
          set -euo pipefail
          # A token pasted into GitHub can carry line breaks, or Cloudflare's whole test command ("Authorization: Bearer <token>").
          # The token is the word after "Bearer", or else the longest run of token characters (Cloudflare tokens are 40+ long).
          CLOUDFLARE_API_TOKEN="$(printf '%s\n' "$BACKUP_TOKEN" | grep -oE 'Bearer [A-Za-z0-9_-]{30,}' | head -n1 | cut -d' ' -f2 || true)"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            CLOUDFLARE_API_TOKEN="$(printf '%s\n' "$BACKUP_TOKEN" | grep -oE '[A-Za-z0-9_-]{30,}' | awk '{ print length, $0 }' | sort -rn | head -n1 | cut -d' ' -f2 || true)"
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_BACKUP_TOKEN is missing"; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          DAY="$(TZ=Europe/Copenhagen date +%F)"
          FILE="$RUNNER_TEMP/hjerterum-$DAY.sql"
          pnpm --dir apps/web exec wrangler d1 export hjerterum-staging --remote --output "$FILE"
          test -s "$FILE"
          gzip -9 "$FILE"
          ls -la "$FILE.gz"
          pnpm --dir apps/web exec wrangler r2 object put "hjerterum-arkiv-eu/kopier/hjerterum-$DAY.sql.gz" --file "$FILE.gz" --content-type application/gzip --jurisdiction eu --remote
          rm -f "$FILE.gz"
